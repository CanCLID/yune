# Project defaults for Yune Codex sessions.
# Keep the explicit model pins under .codex/agents/ synchronized with these values.
model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

sandbox_mode = "danger-full-access"
approval_policy = "never"
[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
