name: Bug
description: Something behaves wrongly in the engine, the ABI, or the browser demo.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        After submitting, set **Priority** and **Effort** in the Fields panel. Before implementation, confirm the native **Type**, area label and any applicable work labels, then set the native roadmap parent and actual **blocked by** relationships listed below.
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      description: Which part of Yune is affected?
      options:
        - engine
        - web
        - abi
        - platform
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Relationships
      description: Link the pinned roadmap parent and actual prerequisites. Set these as native GitHub relationships before implementation; this answer does not create them.
      placeholder: |
        Parent: #<roadmap issue>
        Blocked by: #<prerequisite issue(s)> or None
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which schema, platform, browser, or frontend. Include the demo URL build if relevant.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The affected scope, what happens, the expected outcome, and the exact keys typed. Numbers need a source.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps or a CLI command (`cargo run -p yune-cli -- frontend ...`).
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How a fix is verified
      description: Observable acceptance criteria and the commands or checks that show the fix works.
    validations:
      required: true
