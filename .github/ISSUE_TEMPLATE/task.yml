name: Task
description: Measurement, tooling, decision, or cleanup work that is neither a bug nor a feature.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        After submitting, set **Priority** and **Effort** in the Fields panel. Before implementation, confirm the native **Type**, area label and any applicable work labels, then set the native roadmap parent and actual **blocked by** relationships listed below. Use `decision-needed` when blocked on a maintainer decision.
  - type: dropdown
    id: lane
    attributes:
      label: Lane
      options:
        - engine
        - web
        - abi
        - platform
        - docs
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Relationships
      description: Link the pinned roadmap parent and actual prerequisites. Set these as native GitHub relationships before implementation; this answer does not create them.
      placeholder: |
        Parent: #<roadmap issue>
        Blocked by: #<prerequisite issue(s)> or None
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome and scope, in plain language.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How verified
      description: Commands or checks that demonstrate the acceptance criteria.
    validations:
      required: true
