name: Deploy yune-web certified artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Select a source-bound setup retry or an explicitly approved production promotion
        required: true
        type: choice
        options:
          - setup-retry
          - production-promotion
      setup_retry_of:
        description: Numeric attempt-1 run ID of the same-source setup-only failure
        required: false
        type: string
      setup_retry_reason:
        description: Why the prior failure was setup-only (never a measured red)
        required: false
        type: string
      approved_preview_run_id:
        description: Successful attempt-1 preview workflow run ID approved for production
        required: false
        type: string
      approved_source_commit:
        description: Exact 40-character source commit from the approved preview run
        required: false
        type: string
      approved_archive_sha256:
        description: Exact 64-character certified archive SHA-256 from the approved preview run
        required: false
        type: string
      production_approval_record:
        description: Single-line user approval record (ticket, decision URL, or named approval)
        required: false
        type: string
      production_confirmation:
        description: Type PROMOTE_EXACT_PREVIEW_BYTES to authorize this one production promotion
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: yune-web-production-release
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    name: Classify release impact
    if: github.event_name == 'push' || inputs.operation == 'setup-retry'
    runs-on: ubuntu-24.04
    outputs:
      release_required: ${{ steps.classify.outputs.release_required }}
      reason: ${{ steps.classify.outputs.reason }}
      web06_handoff_required: ${{ steps.classify.outputs.web06_handoff_required }}
      web06_reason: ${{ steps.classify.outputs.web06_reason }}
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Check out full source history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          SETUP_RETRY_OF: ${{ inputs.setup_retry_of }}
          SETUP_RETRY_REASON: ${{ inputs.setup_retry_reason }}
        run: |
          python3 -m unittest scripts.tests.test_yune_web_release_policy
          if [ "$SOURCE_REF" != "refs/heads/main" ]; then
            printf 'Production releases are main-only; received %s.\n' "$SOURCE_REF" >&2
            exit 1
          fi
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF {print $1; exit}')"
          printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'Could not prove the current main SHA; refusing to classify this release.\n' >&2
            exit 1
          }
          if [ "$current_main" != "$HEAD_SHA" ]; then
            printf 'release_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'reason=superseded by current main %s\n' "$current_main" >> "$GITHUB_OUTPUT"
            printf 'web06_handoff_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'web06_reason=superseded before release classification\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$SETUP_RETRY_OF" ] || [ -z "$SETUP_RETRY_REASON" ]; then
              printf 'Manual runs require an explicit setup-failure source and reason.\n' >&2
              exit 1
            fi
            if [[ "$SETUP_RETRY_OF" == *$'\n'* || "$SETUP_RETRY_OF" == *$'\r'* || "$SETUP_RETRY_REASON" == *$'\n'* || "$SETUP_RETRY_REASON" == *$'\r'* ]]; then
              printf 'Setup retry metadata must be single-line text.\n' >&2
              exit 1
            fi
            printf '%s\n' "$SETUP_RETRY_OF" | grep -Eq '^[1-9][0-9]*$' || {
              printf 'setup_retry_of must be a numeric prior workflow run ID.\n' >&2
              exit 1
            }
            prior_root="$RUNNER_TEMP/prior-web06-attempt"
            mkdir -p "$prior_root"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SETUP_RETRY_OF" \
              > "$prior_root/prior-run.json"
            gh run download "$SETUP_RETRY_OF" \
              --repo "$GITHUB_REPOSITORY" \
              --name "yune-web-release-$HEAD_SHA-$SETUP_RETRY_OF-1" \
              --dir "$prior_root/artifact"
            receipt_count="$(find "$prior_root/artifact" -name web06-workflow-attempt.json -type f | wc -l | tr -d '[:space:]')"
            test "$receipt_count" = "1" || {
              printf 'Prior run must contain exactly one WEB06 workflow-attempt receipt.\n' >&2
              exit 1
            }
            prior_receipt="$(find "$prior_root/artifact" -name web06-workflow-attempt.json -type f -print -quit)"
            jq -n \
              --arg runId "$GITHUB_RUN_ID" \
              --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg retryOf "$SETUP_RETRY_OF" \
              --arg sourceCommit "$HEAD_SHA" \
              --arg workflowPath ".github/workflows/deploy-yune-web.yml" \
              '{runId: $runId, runAttempt: $runAttempt, retryOf: $retryOf, sourceCommit: $sourceCommit, workflowPath: $workflowPath}' \
              > "$prior_root/current.json"
            node apps/yune-web/e2e/web06-setup-retry.mjs \
              "$prior_root/prior-run.json" "$prior_receipt" "$prior_root/current.json"
            web06_handoff_required="$(jq -r '.web06HandoffRequired // false' "$prior_receipt")"
            if [ "$web06_handoff_required" != true ] && [ "$web06_handoff_required" != false ]; then
              printf 'Prior workflow receipt has an invalid WEB06 handoff classification.\n' >&2
              exit 1
            fi
            printf 'release_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'reason=explicit source-bound setup retry\n' >> "$GITHUB_OUTPUT"
            printf 'web06_handoff_required=%s\n' "$web06_handoff_required" >> "$GITHUB_OUTPUT"
            printf 'web06_reason=classification retained from original attempt\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          deployed_source="$({ curl -fsSL --max-time 20 'https://yune-web.pages.dev/build-info.json' || true; } | python3 -c 'import json,sys; data=sys.stdin.read(); print(json.loads(data).get("sourceCommit", "") if data else "")' 2>/dev/null || true)"
          if printf '%s\n' "$deployed_source" | grep -Eq '^[0-9a-f]{40}$' && \
             git cat-file -e "$deployed_source^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$deployed_source" "$HEAD_SHA"; then
            base="$deployed_source"
          fi
          python3 scripts/classify_yune_web_release.py \
            --repo-root . \
            --base "$base" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  no-release:
    name: Deployment no-op
    needs: classify
    if: needs.classify.outputs.release_required != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Record successful no-op
        env:
          REASON: ${{ needs.classify.outputs.reason }}
        run: |
          printf 'No yune-web release required: %s\n' "$REASON"

  web06-measured-handoff-required:
    name: Preserve pending WEB06 deployment identity
    needs: classify
    if: needs.classify.outputs.release_required == 'true' && needs.classify.outputs.web06_handoff_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns cannot supply WEB06 measured bytes.\n' >&2
            exit 1
          }
      - name: Check out exact source without building
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record create-new pending-identity receipt
        env:
          WEB06_REASON: ${{ needs.classify.outputs.web06_reason }}
        run: |
          receipt_root="$RUNNER_TEMP/web06-measured-handoff-required"
          mkdir "$receipt_root"
          test -z "$(git status --porcelain --untracked-files=all)" || {
            printf 'WEB06 pending-identity receipt requires a clean exact checkout.\n' >&2
            exit 1
          }
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg sourceTree "$source_tree" \
            --arg reason "$WEB06_REASON" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: "web06-ci-handoff-noop-v1", operation: "measured-artifact-handoff-required", sourceCommit: $sourceCommit, sourceTree: $sourceTree, sourceTreeState: "clean", reason: $reason, deploymentIdentityStatus: "pending", fullSuccessEligible: false, buildInvoked: false, measurementInvoked: false, previewMutationStarted: false, productionMutationStarted: false, generatedAt: $generatedAt, status: "no-op"}' \
            > "$receipt_root/web06-ci-handoff-noop.json"
          printf 'WEB06 release is a green CI no-op: no reviewed immutable handoff exists for the locally measured archive. Deployment identity remains pending and this receipt cannot satisfy WEB06 Full.\n'
      - name: Preserve pending-identity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web06-measured-handoff-required-${{ github.sha }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/web06-measured-handoff-required
          if-no-files-found: error
          retention-days: 90

  build-certify:
    name: Build and certify exact source
    needs: classify
    if: needs.classify.outputs.release_required == 'true' && needs.classify.outputs.web06_handoff_required != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      archive_sha256: ${{ steps.seal.outputs.archive_sha256 }}
      artifact_name: yune-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      certification_mode: ${{ steps.certification-mode.outputs.certification_mode }}
    env:
      CI: "1"
      YUNE_WEB_RELEASE_CERTIFICATION_MODE: legacy
    steps:
      - name: Seed source-bound receipts before setup
        env:
          SETUP_RETRY_OF: ${{ inputs.setup_retry_of }}
          SETUP_RETRY_REASON: ${{ inputs.setup_retry_reason }}
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/yune-web-release-$GITHUB_SHA"
          printf 'EVIDENCE_ROOT=%s\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'YUNE_WEB_LATENCY_OUTPUT_DIR=%s/latency\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'YUNE_WEB_LATENCY_EVIDENCE_DIR=%s/latency\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'YUNE_WEB06_EVIDENCE_ROOT=%s/web06\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'YUNE_WEB06_PLAYWRIGHT_OUTPUT_DIR=%s/web06/playwright\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'YUNE_WEB_WORKFLOW_MEASUREMENT_STARTED_PATH=%s/web06-workflow-measurement-started.json\n' "$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_ROOT/latency" "$EVIDENCE_ROOT/web06/playwright"
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'source_tree_state=unavailable-before-checkout\n'
            printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'setup_retry_of=%s\n' "${SETUP_RETRY_OF:-not-applicable}"
            printf 'setup_retry_reason=%s\n' "${SETUP_RETRY_REASON:-not-applicable}"
            uname -a
          } > "$EVIDENCE_ROOT/environment.txt"
          {
            printf '%s\n' 'bash apps/yune-web/public-demo/build-public-release.sh'
            printf '%s\n' 'tar built public-demo/dist once; hash exact archive'
            printf '%s\n' 'safely extract and reconcile exact archive bytes'
            printf '%s\n' 'bash apps/yune-web/public-demo/certify-public-release.sh (classifier-selected legacy exact-artifact WEB03 only)'
          } > "$EVIDENCE_ROOT/commands.txt"
      - name: Reject GitHub UI reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            printf 'GitHub reruns are prohibited because they can discard a measured red; use a fresh, explicitly named workflow_dispatch only for setup failure.\n' >&2
            exit 1
          fi
      - name: Select legacy certification internally
        id: certification-mode
        env:
          WEB06_HANDOFF_REQUIRED: ${{ needs.classify.outputs.web06_handoff_required }}
        run: |
          test "$WEB06_HANDOFF_REQUIRED" != true || {
            printf 'A WEB06-governed range cannot select legacy certification.\n' >&2
            exit 1
          }
          test "$YUNE_WEB_RELEASE_CERTIFICATION_MODE" = legacy
          printf 'certification_mode=legacy\n' >> "$GITHUB_OUTPUT"
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record checked-out source state
        run: |
          printf 'checked_out_source_tree_state=%s\n' \
            "$(test -z "$(git status --porcelain --untracked-files=all)" && printf clean || printf dirty)" \
            >> "$EVIDENCE_ROOT/environment.txt"
          printf 'YUNE_WEB06_EXPECTED_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Build pinned public artifact
        run: bash apps/yune-web/public-demo/build-public-release.sh
      - name: Seal public artifact once before measurement
        id: seal
        run: |
          cp apps/yune-web/public-demo/dist/build-info.json "$EVIDENCE_ROOT/build-info.json"
          cp apps/yune-web/public-demo/dist/public-artifact-manifest.json "$EVIDENCE_ROOT/public-artifact-manifest.json"
          tar -C apps/yune-web/public-demo/dist -czf "$EVIDENCE_ROOT/yune-web-dist.tar.gz" .
          archive_sha256="$(sha256sum "$EVIDENCE_ROOT/yune-web-dist.tar.gz" | awk '{print $1}')"
          printf '%s\n' "$archive_sha256" > "$EVIDENCE_ROOT/yune-web-dist.tar.gz.sha256"
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"
          printf 'sealed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_ROOT/environment.txt"
      - name: Safely extract and reconcile sealed bytes
        env:
          ARCHIVE: ${{ runner.temp }}/yune-web-release-${{ github.sha }}/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/certified-release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ steps.seal.outputs.archive_sha256 }}
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/certified-release-dist
          YUNE_WEB_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          YUNE_WEB_LOCAL_ARTIFACT_RECEIPT: ${{ runner.temp }}/yune-web-release-${{ github.sha }}/sealed-artifact-verification.json
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          seen = set()
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  normalized = relative.as_posix()
                  if normalized == "." and member.isdir():
                      continue
                  if (
                      relative.is_absolute()
                      or ".." in relative.parts
                      or "\\" in member.name
                      or not (member.isfile() or member.isdir())
                      or normalized == "."
                      or normalized in seen
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  seen.add(normalized)
              bundle.extractall(destination, members=members, filter="data")
          PY
          node apps/yune-web/e2e/verify-local-artifact.mjs
      - name: Run classifier-selected legacy exact-artifact certification
        id: certify
        env:
          YUNE_WEB06_CERTIFIED_ARCHIVE: ${{ runner.temp }}/yune-web-release-${{ github.sha }}/yune-web-dist.tar.gz
          YUNE_WEB06_CERTIFIED_ARCHIVE_SHA256: ${{ steps.seal.outputs.archive_sha256 }}
          YUNE_WEB06_CERTIFIED_DIST_ROOT: ${{ runner.temp }}/certified-release-dist
          YUNE_WEB06_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash apps/yune-web/public-demo/certify-public-release.sh
          printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$EVIDENCE_ROOT/environment.txt"
      - name: Finalize immutable retry classification receipt
        if: always()
        env:
          CERTIFY_OUTCOME: ${{ steps.certify.outcome }}
          WEB06_HANDOFF_REQUIRED: ${{ needs.classify.outputs.web06_handoff_required }}
        run: |
          normalized_outcome=failure
          [ "$CERTIFY_OUTCOME" = success ] && normalized_outcome=success
          current="$RUNNER_TEMP/web06-workflow-attempt-input.json"
          jq -n \
            --arg workflowPath ".github/workflows/deploy-yune-web.yml" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson web06HandoffRequired "$WEB06_HANDOFF_REQUIRED" \
            --arg certifyOutcome "$normalized_outcome" \
            '{version: "web06-workflow-attempt-input-v1", workflowPath: $workflowPath, sourceCommit: $sourceCommit, runId: $runId, runAttempt: $runAttempt, web06HandoffRequired: $web06HandoffRequired, certifyOutcome: $certifyOutcome}' \
            > "$current"
          attempt_receipt="$EVIDENCE_ROOT/web06-workflow-attempt.json"
          marker="$EVIDENCE_ROOT/web06-workflow-measurement-started.json"
          if [ -f apps/yune-web/e2e/web06-workflow-attempt.mjs ]; then
            node apps/yune-web/e2e/web06-workflow-attempt.mjs \
              "$current" \
              "$marker" \
              "$EVIDENCE_ROOT/latency/input-latency-hard-stop.json" \
              "$EVIDENCE_ROOT/latency/normal-typing-exact-input.json" \
              "$EVIDENCE_ROOT/web06/legacy-local-certification.json" \
              "$attempt_receipt"
          else
            measurement_started=false
            failure_class=SETUP_ONLY
            if [ -e "$marker" ]; then
              measurement_started=true
              failure_class=MEASUREMENT_OR_BEHAVIOR
            elif [ "$normalized_outcome" = success ]; then
              failure_class=EVIDENCE_INVALID
            fi
            jq -n \
              --arg workflowPath ".github/workflows/deploy-yune-web.yml" \
              --arg sourceCommit "$GITHUB_SHA" \
              --arg runId "$GITHUB_RUN_ID" \
              --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg failureClass "$failure_class" \
              --argjson measurementStarted "$measurement_started" \
              '{version: "web06-workflow-attempt-v1", workflowPath: $workflowPath, sourceCommit: $sourceCommit, runId: $runId, runAttempt: $runAttempt, web06HandoffRequired: false, certifyOutcome: "failure", status: "failed", failureClass: $failureClass, measurementStarted: $measurementStarted, measurementCompleted: false, validRedObserved: false, canaryStarted: false, productionMutationStarted: false}' \
              > "$attempt_receipt"
          fi
          if [ "$normalized_outcome" = success ]; then
            jq -e '.status == "passed" and .failureClass == "NONE" and .measurementStarted == true and .measurementCompleted == true and .validRedObserved == false' "$attempt_receipt" >/dev/null
          fi
      - name: Preserve build, gate, and artifact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yune-web-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90

  validate-artifact:
    name: Independently validate sealed artifact
    needs: build-certify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Seed validation receipt
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-validation"
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$GITHUB_SHA"
            printf '  "seededAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "status": "setup-pending"\n'
            printf '}\n'
          } > "$RUNNER_TEMP/artifact-validation/setup-status.json"
      - name: Check out source-bound verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download sealed bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-certify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Safely extract exact archive
        env:
          ARCHIVE: ${{ runner.temp }}/release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-certify.outputs.archive_sha256 }}
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  if (
                      relative.is_absolute()
                      or ".." in relative.parts
                      or "\\" in member.name
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Reconcile source, toolchain, inventory, and every file
        id: reconcile
        env:
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/release-dist
          YUNE_WEB_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          YUNE_WEB_LOCAL_ARTIFACT_RECEIPT: ${{ runner.temp }}/artifact-validation/local-artifact-verification.json
        run: |
          node --test apps/yune-web/e2e/public-artifact-verifier.test.mjs
          node apps/yune-web/e2e/verify-local-artifact.mjs
      - name: Finalize validation status
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          status=failed
          [ "$RECONCILE_OUTCOME" = success ] && status=passed
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$GITHUB_SHA"
            printf '  "completedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "status": "%s"\n' "$status"
            printf '}\n'
          } > "$RUNNER_TEMP/artifact-validation/setup-status.json"
      - name: Preserve independent validation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-artifact-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-validation
          if-no-files-found: error
          retention-days: 90

  authorize-preview:
    name: Confirm candidate is current main
    needs: validate-artifact
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.current.outputs.current }}
      current_main: ${{ steps.current.outputs.current_main }}
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Classify current-main state
        id: current
        run: |
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF {print $1; exit}')"
          printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'Could not prove the current main SHA; refusing to authorize preview.\n' >&2
            exit 1
          }
          printf 'current_main=%s\n' "$current_main" >> "$GITHUB_OUTPUT"
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'Candidate %s is superseded by current main %s; preserving green certification without upload.\n' "$GITHUB_SHA" "$current_main"
          fi

  superseded-after-certification:
    name: Certified candidate superseded
    needs: authorize-preview
    if: needs.authorize-preview.outputs.current != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - run: printf 'Certified source was superseded before preview; no Cloudflare credentials were used.\n'

  deploy-preview:
    name: Upload certified preview
    needs:
      - build-certify
      - authorize-preview
    if: needs.authorize-preview.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: yune-web-preview
    outputs:
      deployment_url: ${{ steps.resolve.outputs.deployment_url }}
      deployment_id: ${{ steps.resolve.outputs.deployment_id }}
      current: ${{ steps.late-current.outputs.current }}
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Seed preview deployment receipt
        run: |
          mkdir -p "$RUNNER_TEMP/preview-deployment"
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'attempted_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'status=setup-pending\n'
          } > "$RUNNER_TEMP/preview-deployment/deployment.txt"
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-certify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Verify digest and safely extract certified bundle
        env:
          ARCHIVE: ${{ runner.temp }}/release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-certify.outputs.archive_sha256 }}
        run: |
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          printf 'archive_sha256=%s\nstatus=artifact-validated\n' "$actual" >> "$RUNNER_TEMP/preview-deployment/deployment.txt"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or ".." in relative.parts or "\\" in member.name or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Install exact Wrangler without credentials
        run: |
          npm install --global wrangler@4.111.0
          test "$(wrangler --version)" = "4.111.0"
      - name: Reconfirm candidate after environment admission
        id: late-current
        run: |
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF {print $1; exit}')"
          printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'Could not prove the current main SHA; refusing to use Cloudflare credentials.\n' >&2
            exit 1
          }
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'Candidate %s was superseded by %s during environment admission; upload is a green no-op.\n' "$GITHUB_SHA" "$current_main"
          fi
      - name: Assert Cloudflare Git auto-deploy remains disabled
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yune-web" \
            > "$RUNNER_TEMP/cloudflare-project-response.json"
          jq -e '.result.source.config.production_deployments_enabled == false and .result.source.config.preview_deployment_setting == "none"' \
            "$RUNNER_TEMP/cloudflare-project-response.json" >/dev/null
          jq '{name: .result.name, source: {type: .result.source.type, config: {production_deployments_enabled: .result.source.config.production_deployments_enabled, preview_deployment_setting: .result.source.config.preview_deployment_setting}}}' \
            "$RUNNER_TEMP/cloudflare-project-response.json" > "$RUNNER_TEMP/preview-deployment/project-interlock.json"
      - name: Direct-upload preview without rebuilding
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          set -o pipefail
          wrangler pages deploy "$RUNNER_TEMP/release-dist" \
            --project-name yune-web \
            --branch "verify-$GITHUB_SHA" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/preview-deployment/wrangler.log"
      - name: Resolve and assert preview deployment identity
        id: resolve
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployment_url="$(grep 'Take a peek over at' "$RUNNER_TEMP/preview-deployment/wrangler.log" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n 1)"
          test -n "$deployment_url"
          selected=null
          for attempt in 1 2 3 4 5 6; do
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yune-web/deployments" \
              > "$RUNNER_TEMP/preview-deployments-response.json"
            selected="$(jq -c --arg url "$deployment_url" --arg sha "$GITHUB_SHA" --arg branch "verify-$GITHUB_SHA" \
              '[.result[] | select(.url == $url and .environment == "preview" and .deployment_trigger.metadata.commit_hash == $sha and .deployment_trigger.metadata.branch == $branch) | {id, url, environment, created_on, deployment_trigger: {type: .deployment_trigger.type, metadata: {branch: .deployment_trigger.metadata.branch, commit_hash: .deployment_trigger.metadata.commit_hash, commit_dirty: .deployment_trigger.metadata.commit_dirty}}, latest_stage: {status: .latest_stage.status}}] | sort_by(.created_on) | last' \
              "$RUNNER_TEMP/preview-deployments-response.json")"
            [ "$selected" != "null" ] && break
            sleep 2
          done
          test "$selected" != "null"
          printf '%s\n' "$selected" > "$RUNNER_TEMP/preview-deployment/deployment.json"
          deployment_id="$(printf '%s\n' "$selected" | jq -r '.id')"
          resolved_url="$(printf '%s\n' "$selected" | jq -r '.url')"
          test -n "$deployment_id"
          test "$deployment_id" != "null"
          test "$resolved_url" = "$deployment_url"
          test "$(printf '%s\n' "$selected" | jq -r '.latest_stage.status')" = "success"
          test "$(printf '%s\n' "$selected" | jq -r '.deployment_trigger.type')" = "ad_hoc"
          test "$(printf '%s\n' "$selected" | jq -r '.deployment_trigger.metadata.commit_dirty')" = "false"
          printf 'deployment_url=%s\n' "$resolved_url" >> "$GITHUB_OUTPUT"
          printf 'deployment_id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          {
            printf 'deployment_url=%s\n' "$resolved_url"
            printf 'deployment_id=%s\n' "$deployment_id"
            printf 'environment=preview\n'
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'status=uploaded\n'
          } >> "$RUNNER_TEMP/preview-deployment/deployment.txt"
      - name: Record superseded admission no-op
        if: steps.late-current.outputs.current != 'true'
        run: printf 'status=superseded-after-environment-admission\n' >> "$RUNNER_TEMP/preview-deployment/deployment.txt"
      - name: Preserve preview deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-preview-deployment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-deployment
          if-no-files-found: error
          retention-days: 90

  preview-canary:
    name: Source-pinned preview canary
    needs:
      - build-certify
      - deploy-preview
    if: needs.deploy-preview.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      YUNE_WEB_APP_URL: ${{ needs.deploy-preview.outputs.deployment_url }}
      YUNE_WEB_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
      YUNE_WEB_RELEASE_CERTIFICATION_MODE: ${{ needs.build-certify.outputs.certification_mode }}
      YUNE_WEB_REQUIRE_TOOLCHAIN_RECEIPT: "1"
    steps:
      - name: Seed preview canary receipt
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'YUNE_WEB_LATENCY_OUTPUT_DIR=%s/preview-canary\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'YUNE_WEB_LATENCY_EVIDENCE_DIR=%s/preview-canary\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/preview-canary"
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$GITHUB_SHA"
            printf '  "appUrl": "%s",\n' "$YUNE_WEB_APP_URL"
            printf '  "seededAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "canaryStarted": false,\n'
            printf '  "status": "setup-pending"\n'
            printf '}\n'
          } > "$RUNNER_TEMP/preview-canary/setup-status.json"
      - name: Reject GitHub UI reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            printf 'GitHub reruns are prohibited because they can discard a measured red; use a fresh, explicitly named workflow_dispatch only for setup failure.\n' >&2
            exit 1
          fi
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download sealed bundle for preview reconciliation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-certify.outputs.artifact_name }}
          path: ${{ runner.temp }}/preview-release
      - name: Safely extract and verify sealed preview reference
        env:
          ARCHIVE: ${{ runner.temp }}/preview-release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/preview-certified-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-certify.outputs.archive_sha256 }}
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/preview-certified-dist
          YUNE_WEB_LOCAL_ARTIFACT_RECEIPT: ${{ runner.temp }}/preview-canary/sealed-artifact-verification.json
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          seen = set()
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  normalized = relative.as_posix()
                  if normalized == "." and member.isdir():
                      continue
                  if (
                      relative.is_absolute()
                      or ".." in relative.parts
                      or "\\" in member.name
                      or not (member.isfile() or member.isdir())
                      or normalized == "."
                      or normalized in seen
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  seen.add(normalized)
              bundle.extractall(destination, members=members, filter="data")
          PY
          node apps/yune-web/e2e/verify-local-artifact.mjs
      - name: Reconcile every deployed preview byte before timing
        env:
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/preview-certified-dist
          YUNE_WEB_DEPLOYMENT_RECEIPT: ${{ runner.temp }}/preview-canary/deployed-artifact-verification.json
        run: node apps/yune-web/e2e/verify-deployed-artifact.mjs
      - name: Install source-pinned canary runtime
        run: |
          npm --prefix apps/yune-web/e2e ci
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node apps/yune-web/e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the unchanged legacy WEB03 preview canary once
        run: |
          web03_status=failed
          if npm --prefix apps/yune-web/e2e run test:e2e:input-latency; then
            web03_status=passed
          fi
          status=failed
          [ "$web03_status" = passed ] && status=passed
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$GITHUB_SHA"
            printf '  "appUrl": "%s",\n' "$YUNE_WEB_APP_URL"
            printf '  "completedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "certificationMode": "legacy",\n'
            printf '  "canaryStarted": true,\n'
            printf '  "web03Status": "%s",\n' "$web03_status"
            printf '  "web06Status": "not-run",\n'
            printf '  "web06ClaimMade": false,\n'
            printf '  "status": "%s"\n' "$status"
            printf '}\n'
          } > "$RUNNER_TEMP/preview-canary/setup-status.json"
          test "$status" = passed
      - name: Preserve preview canary receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-preview-canary-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-canary
          if-no-files-found: error
          retention-days: 90

  # A green preview run is terminal. Production starts only in a distinct,
  # explicitly confirmed workflow_dispatch and reuses that run's exact bytes.
  authorize-production:
    name: Authorize an exact preview artifact for production
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'production-promotion'
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      source_commit: ${{ steps.authorize.outputs.source_commit }}
      archive_sha256: ${{ steps.authorize.outputs.archive_sha256 }}
      preview_run_id: ${{ steps.authorize.outputs.preview_run_id }}
      artifact_name: ${{ steps.authorize.outputs.artifact_name }}
      canary_artifact_name: ${{ steps.authorize.outputs.canary_artifact_name }}
      preview_deployment_artifact_name: ${{ steps.authorize.outputs.preview_deployment_artifact_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_PREVIEW_RUN_ID: ${{ inputs.approved_preview_run_id }}
      APPROVED_SOURCE_COMMIT: ${{ inputs.approved_source_commit }}
      APPROVED_ARCHIVE_SHA256: ${{ inputs.approved_archive_sha256 }}
      PRODUCTION_APPROVAL_RECORD: ${{ inputs.production_approval_record }}
      PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
      SETUP_RETRY_OF: ${{ inputs.setup_retry_of }}
      SETUP_RETRY_REASON: ${{ inputs.setup_retry_reason }}
    steps:
      - name: Reject reruns and mixed dispatch modes
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh production promotion.\n' >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/main" || {
            printf 'Production promotion dispatches are main-only.\n' >&2
            exit 1
          }
          test -z "$SETUP_RETRY_OF" && test -z "$SETUP_RETRY_REASON" || {
            printf 'Production promotion cannot carry setup-retry metadata.\n' >&2
            exit 1
          }
      - name: Validate explicit production authorization
        id: authorize
        run: |
          printf '%s\n' "$APPROVED_PREVIEW_RUN_ID" | grep -Eq '^[1-9][0-9]*$' || {
            printf 'approved_preview_run_id must be a prior numeric workflow run ID.\n' >&2
            exit 1
          }
          printf '%s\n' "$APPROVED_SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'approved_source_commit must be a full lowercase Git SHA.\n' >&2
            exit 1
          }
          printf '%s\n' "$APPROVED_ARCHIVE_SHA256" | grep -Eq '^[0-9a-f]{64}$' || {
            printf 'approved_archive_sha256 must be a full lowercase SHA-256.\n' >&2
            exit 1
          }
          test "$PRODUCTION_CONFIRMATION" = "PROMOTE_EXACT_PREVIEW_BYTES" || {
            printf 'Production requires the exact PROMOTE_EXACT_PREVIEW_BYTES confirmation.\n' >&2
            exit 1
          }
          test -n "$PRODUCTION_APPROVAL_RECORD" || {
            printf 'A production_approval_record is required.\n' >&2
            exit 1
          }
          printf '%s' "$PRODUCTION_APPROVAL_RECORD" | grep -Eq '[^[:space:]]' || {
            printf 'production_approval_record must contain non-whitespace text.\n' >&2
            exit 1
          }
          if printf '%s' "$PRODUCTION_APPROVAL_RECORD" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            printf 'production_approval_record must be single-line text without control characters.\n' >&2
            exit 1
          fi
          test "$APPROVED_PREVIEW_RUN_ID" != "$GITHUB_RUN_ID" || {
            printf 'Production must reference a distinct prior preview run.\n' >&2
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_PREVIEW_RUN_ID" \
            > "$RUNNER_TEMP/approved-preview-run.json"
          jq -e \
            --argjson run_id "$APPROVED_PREVIEW_RUN_ID" \
            --arg sha "$APPROVED_SOURCE_COMMIT" \
            --arg workflow_path ".github/workflows/deploy-yune-web.yml" \
            '.id == $run_id and
             .status == "completed" and
             .conclusion == "success" and
             .run_attempt == 1 and
             .head_sha == $sha and
             .path == $workflow_path and
             (.event == "push" or .event == "workflow_dispatch")' \
            "$RUNNER_TEMP/approved-preview-run.json" >/dev/null

          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF {print $1; exit}')"
          printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'Could not prove current main; refusing production authorization.\n' >&2
            exit 1
          }
          test "$current_main" = "$APPROVED_SOURCE_COMMIT" || {
            printf 'Approved source %s is superseded by current main %s.\n' "$APPROVED_SOURCE_COMMIT" "$current_main" >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_COMMIT" || {
            printf 'Dispatch workflow source does not equal the approved source.\n' >&2
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/production-authorization"
          jq -n \
            --arg sourceCommit "$APPROVED_SOURCE_COMMIT" \
            --arg archiveSha256 "$APPROVED_ARCHIVE_SHA256" \
            --arg previewRunId "$APPROVED_PREVIEW_RUN_ID" \
            --arg approvalRecord "$PRODUCTION_APPROVAL_RECORD" \
            --arg authorizedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sourceCommit: $sourceCommit, archiveSha256: $archiveSha256, previewRunId: $previewRunId, approvalRecord: $approvalRecord, confirmation: "PROMOTE_EXACT_PREVIEW_BYTES", authorizedAt: $authorizedAt}' \
            > "$RUNNER_TEMP/production-authorization/authorization.json"
          cp "$RUNNER_TEMP/approved-preview-run.json" "$RUNNER_TEMP/production-authorization/approved-preview-run.json"
          printf 'authorized=true\n' >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$APPROVED_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$APPROVED_ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          printf 'preview_run_id=%s\n' "$APPROVED_PREVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=yune-web-release-%s-%s-1\n' "$APPROVED_SOURCE_COMMIT" "$APPROVED_PREVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'canary_artifact_name=yune-web-preview-canary-%s-%s-1\n' "$APPROVED_SOURCE_COMMIT" "$APPROVED_PREVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'preview_deployment_artifact_name=yune-web-preview-deployment-%s-%s-1\n' "$APPROVED_SOURCE_COMMIT" "$APPROVED_PREVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Preserve explicit production authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-production-authorization-${{ inputs.approved_source_commit }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/production-authorization
          if-no-files-found: error
          retention-days: 90

  validate-approved-preview:
    name: Revalidate the approved prior-run archive and preview receipts
    needs: authorize-production
    if: needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out verifier at the approved source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.authorize-production.outputs.source_commit }}
          fetch-depth: 1
      - name: Download exact certified archive from the approved preview run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize-production.outputs.artifact_name }}
          path: ${{ runner.temp }}/approved-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-production.outputs.preview_run_id }}
      - name: Download exact canary receipts from the approved preview run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize-production.outputs.canary_artifact_name }}
          path: ${{ runner.temp }}/approved-canary
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-production.outputs.preview_run_id }}
      - name: Download exact deployment receipt from the approved preview run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize-production.outputs.preview_deployment_artifact_name }}
          path: ${{ runner.temp }}/approved-preview-deployment
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-production.outputs.preview_run_id }}
      - name: Verify exact archive identity and safely extract it
        env:
          ARCHIVE: ${{ runner.temp }}/approved-release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/approved-release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.authorize-production.outputs.archive_sha256 }}
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          seen = set()
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  normalized = relative.as_posix()
                  if normalized == "." and member.isdir():
                      continue
                  if (
                      relative.is_absolute()
                      or ".." in relative.parts
                      or "\\" in member.name
                      or not (member.isfile() or member.isdir())
                      or normalized == "."
                      or normalized in seen
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  seen.add(normalized)
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Reconcile source, toolchain, inventory, and every local file
        env:
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/approved-release-dist
          YUNE_WEB_EXPECTED_SOURCE_COMMIT: ${{ needs.authorize-production.outputs.source_commit }}
          YUNE_WEB_LOCAL_ARTIFACT_RECEIPT: ${{ runner.temp }}/approved-preview-validation/local-artifact-verification.json
        run: |
          mkdir -p "$RUNNER_TEMP/approved-preview-validation"
          node --test apps/yune-web/e2e/public-artifact-verifier.test.mjs
          node apps/yune-web/e2e/verify-local-artifact.mjs
      - name: Require green preview reconciliation and frozen canaries
        env:
          APPROVED_SOURCE_COMMIT: ${{ needs.authorize-production.outputs.source_commit }}
          APPROVED_ARCHIVE_SHA256: ${{ needs.authorize-production.outputs.archive_sha256 }}
        run: |
          grep -Fx "source_commit=$APPROVED_SOURCE_COMMIT" \
            "$RUNNER_TEMP/approved-preview-deployment/deployment.txt" >/dev/null
          grep -Fx "archive_sha256=$APPROVED_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/approved-preview-deployment/deployment.txt" >/dev/null
          grep -Fx "status=uploaded" \
            "$RUNNER_TEMP/approved-preview-deployment/deployment.txt" >/dev/null
          jq -e \
            --arg sha "$APPROVED_SOURCE_COMMIT" \
            '.environment == "preview" and .latest_stage.status == "success" and .deployment_trigger.type == "ad_hoc" and .deployment_trigger.metadata.commit_hash == $sha and .deployment_trigger.metadata.commit_dirty == false' \
            "$RUNNER_TEMP/approved-preview-deployment/deployment.json" >/dev/null
          jq -e \
            '.source.config.production_deployments_enabled == false and .source.config.preview_deployment_setting == "none"' \
            "$RUNNER_TEMP/approved-preview-deployment/project-interlock.json" >/dev/null
          jq -e \
            --arg sha "$APPROVED_SOURCE_COMMIT" \
            '.sourceCommit == $sha and .certificationMode == "legacy" and .canaryStarted == true and .web03Status == "passed" and .web06Status == "not-run" and .web06ClaimMade == false and .status == "passed"' \
            "$RUNNER_TEMP/approved-canary/setup-status.json" >/dev/null
          jq -e \
            --arg sha "$APPROVED_SOURCE_COMMIT" \
            '.expectedSourceCommit == $sha and .passed == true and (.verified | length) > 0' \
            "$RUNNER_TEMP/approved-canary/deployed-artifact-verification.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/approved-preview-validation/approved-receipts"
          cp "$RUNNER_TEMP/approved-preview-deployment/deployment.txt" \
            "$RUNNER_TEMP/approved-preview-deployment/deployment.json" \
            "$RUNNER_TEMP/approved-preview-deployment/project-interlock.json" \
            "$RUNNER_TEMP/approved-canary/setup-status.json" \
            "$RUNNER_TEMP/approved-canary/deployed-artifact-verification.json" \
            "$RUNNER_TEMP/approved-preview-validation/approved-receipts/"
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$APPROVED_SOURCE_COMMIT"
            printf '  "archiveSha256": "%s",\n' "$APPROVED_ARCHIVE_SHA256"
            printf '  "validatedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "status": "passed"\n'
            printf '}\n'
          } > "$RUNNER_TEMP/approved-preview-validation/status.json"
      - name: Preserve approved-preview revalidation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-approved-preview-validation-${{ needs.authorize-production.outputs.source_commit }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/approved-preview-validation
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Promote identical bytes to production
    needs:
      - authorize-production
      - validate-approved-preview
    if: needs.authorize-production.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: yune-web-production
    outputs:
      deployment_url: ${{ steps.resolve.outputs.deployment_url }}
      deployment_id: ${{ steps.resolve.outputs.deployment_id }}
      current: ${{ steps.late-current.outputs.current }}
    env:
      APPROVED_SOURCE_COMMIT: ${{ needs.authorize-production.outputs.source_commit }}
      APPROVED_ARCHIVE_SHA256: ${{ needs.authorize-production.outputs.archive_sha256 }}
      APPROVED_PREVIEW_RUN_ID: ${{ needs.authorize-production.outputs.preview_run_id }}
      PRODUCTION_APPROVAL_RECORD: ${{ inputs.production_approval_record }}
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Seed production deployment receipt
        run: |
          mkdir -p "$RUNNER_TEMP/production-deployment"
          {
            printf 'source_commit=%s\n' "$APPROVED_SOURCE_COMMIT"
            printf 'archive_sha256=%s\n' "$APPROVED_ARCHIVE_SHA256"
            printf 'approved_preview_run_id=%s\n' "$APPROVED_PREVIEW_RUN_ID"
            printf 'approval_record=%s\n' "$PRODUCTION_APPROVAL_RECORD"
            printf 'attempted_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'status=setup-pending\n'
          } > "$RUNNER_TEMP/production-deployment/deployment.txt"
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize-production.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-production.outputs.preview_run_id }}
      - name: Verify digest and safely extract certified bundle
        env:
          ARCHIVE: ${{ runner.temp }}/release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.authorize-production.outputs.archive_sha256 }}
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          printf 'status=artifact-validated\n' >> "$RUNNER_TEMP/production-deployment/deployment.txt"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or ".." in relative.parts or "\\" in member.name or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Install exact Wrangler without credentials
        run: |
          npm install --global wrangler@4.111.0
          test "$(wrangler --version)" = "4.111.0"
      - name: Reconfirm candidate after environment admission
        id: late-current
        run: |
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk 'NF {print $1; exit}')"
          printf '%s\n' "$current_main" | grep -Eq '^[0-9a-f]{40}$' || {
            printf 'Could not prove the current main SHA; refusing to use Cloudflare credentials.\n' >&2
            exit 1
          }
          if [ "$current_main" = "$APPROVED_SOURCE_COMMIT" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'Candidate %s was superseded by %s during environment admission; production upload is a green no-op.\n' "$APPROVED_SOURCE_COMMIT" "$current_main"
          fi
      - name: Assert Cloudflare Git auto-deploy remains disabled
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yune-web" \
            > "$RUNNER_TEMP/cloudflare-project-response.json"
          jq -e '.result.source.config.production_deployments_enabled == false and .result.source.config.preview_deployment_setting == "none"' \
            "$RUNNER_TEMP/cloudflare-project-response.json" >/dev/null
          jq '{name: .result.name, source: {type: .result.source.type, config: {production_deployments_enabled: .result.source.config.production_deployments_enabled, preview_deployment_setting: .result.source.config.preview_deployment_setting}}}' \
            "$RUNNER_TEMP/cloudflare-project-response.json" > "$RUNNER_TEMP/production-deployment/project-interlock.json"
      - name: Direct-upload production without rebuilding
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          set -o pipefail
          wrangler pages deploy "$RUNNER_TEMP/release-dist" \
            --project-name yune-web \
            --branch main \
            --commit-hash "$APPROVED_SOURCE_COMMIT" \
            --commit-dirty=false 2>&1 | tee "$RUNNER_TEMP/production-deployment/wrangler.log"
      - name: Resolve and assert production deployment identity
        id: resolve
        if: steps.late-current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployment_url="$(grep 'Take a peek over at' "$RUNNER_TEMP/production-deployment/wrangler.log" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | tail -n 1)"
          test -n "$deployment_url"
          selected=null
          for attempt in 1 2 3 4 5 6; do
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/yune-web/deployments" \
              > "$RUNNER_TEMP/production-deployments-response.json"
            selected="$(jq -c --arg url "$deployment_url" --arg sha "$APPROVED_SOURCE_COMMIT" \
              '[.result[] | select(.url == $url and .environment == "production" and .deployment_trigger.metadata.commit_hash == $sha and .deployment_trigger.metadata.branch == "main") | {id, url, environment, created_on, deployment_trigger: {type: .deployment_trigger.type, metadata: {branch: .deployment_trigger.metadata.branch, commit_hash: .deployment_trigger.metadata.commit_hash, commit_dirty: .deployment_trigger.metadata.commit_dirty}}, latest_stage: {status: .latest_stage.status}}] | sort_by(.created_on) | last' \
              "$RUNNER_TEMP/production-deployments-response.json")"
            [ "$selected" != "null" ] && break
            sleep 2
          done
          test "$selected" != "null"
          printf '%s\n' "$selected" > "$RUNNER_TEMP/production-deployment/deployment.json"
          deployment_id="$(printf '%s\n' "$selected" | jq -r '.id')"
          resolved_url="$(printf '%s\n' "$selected" | jq -r '.url')"
          test -n "$deployment_id"
          test "$deployment_id" != "null"
          test "$resolved_url" = "$deployment_url"
          test "$(printf '%s\n' "$selected" | jq -r '.latest_stage.status')" = "success"
          test "$(printf '%s\n' "$selected" | jq -r '.deployment_trigger.type')" = "ad_hoc"
          test "$(printf '%s\n' "$selected" | jq -r '.deployment_trigger.metadata.commit_dirty')" = "false"
          printf 'deployment_url=%s\n' "$resolved_url" >> "$GITHUB_OUTPUT"
          printf 'deployment_id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          {
            printf 'deployment_url=%s\n' "$resolved_url"
            printf 'deployment_id=%s\n' "$deployment_id"
            printf 'environment=production\n'
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'status=uploaded\n'
          } >> "$RUNNER_TEMP/production-deployment/deployment.txt"
      - name: Record superseded admission no-op
        if: steps.late-current.outputs.current != 'true'
        run: printf 'status=superseded-after-environment-admission\n' >> "$RUNNER_TEMP/production-deployment/deployment.txt"
      - name: Preserve production deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-production-deployment-${{ needs.authorize-production.outputs.source_commit }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/production-deployment
          if-no-files-found: error
          retention-days: 90

  verify-production:
    name: Verify production identity and bytes
    needs:
      - authorize-production
      - deploy-production
    if: needs.deploy-production.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YUNE_WEB_APP_URL: https://yune-web.pages.dev/
      YUNE_WEB_EXPECTED_SOURCE_COMMIT: ${{ needs.authorize-production.outputs.source_commit }}
    steps:
      - name: Reject GitHub UI reruns
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            printf 'GitHub UI reruns are prohibited; dispatch a fresh, explicitly named setup-only retry.\n' >&2
            exit 1
          }
      - name: Seed production verification receipt
        run: |
          mkdir -p "$RUNNER_TEMP/production-verification"
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$YUNE_WEB_EXPECTED_SOURCE_COMMIT"
            printf '  "appUrl": "%s",\n' "$YUNE_WEB_APP_URL"
            printf '  "seededAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "status": "setup-pending"\n'
            printf '}\n'
          } > "$RUNNER_TEMP/production-verification/setup-status.json"
      - name: Check out verifier at exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.authorize-production.outputs.source_commit }}
          fetch-depth: 1
      - name: Download certified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.authorize-production.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize-production.outputs.preview_run_id }}
      - name: Verify digest and safely extract certified bundle
        env:
          ARCHIVE: ${{ runner.temp }}/release/yune-web-dist.tar.gz
          DESTINATION: ${{ runner.temp }}/release-dist
          EXPECTED_ARCHIVE_SHA256: ${{ needs.authorize-production.outputs.archive_sha256 }}
        run: |
          sibling="$(tr -d '[:space:]' < "$ARCHIVE.sha256")"
          actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARCHIVE_SHA256"
          test "$actual" = "$sibling"
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=False)
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or ".." in relative.parts or "\\" in member.name or not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
              bundle.extractall(destination, members=members, filter="data")
          PY
      - name: Verify production source, toolchain, and runtime hashes
        id: verify
        env:
          YUNE_WEB_EXPECTED_DIST: ${{ runner.temp }}/release-dist
          YUNE_WEB_DEPLOYMENT_RECEIPT: ${{ runner.temp }}/production-verification/deployed-artifact-verification.json
        run: node apps/yune-web/e2e/verify-deployed-artifact.mjs
      - name: Finalize production verification status
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          status=failed
          [ "$VERIFY_OUTCOME" = success ] && status=passed
          {
            printf '{\n'
            printf '  "sourceCommit": "%s",\n' "$YUNE_WEB_EXPECTED_SOURCE_COMMIT"
            printf '  "appUrl": "%s",\n' "$YUNE_WEB_APP_URL"
            printf '  "completedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "status": "%s"\n' "$status"
            printf '}\n'
          } > "$RUNNER_TEMP/production-verification/setup-status.json"
      - name: Preserve production verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yune-web-production-verification-${{ needs.authorize-production.outputs.source_commit }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/production-verification
          if-no-files-found: error
          retention-days: 90
