name: Rust checks

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint, and workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      # Optimized test builds keep debug assertions and overflow checks, so the
      # real-asset parity suites finish in minutes instead of most of an hour.
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
          rustup default 1.96.1
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
