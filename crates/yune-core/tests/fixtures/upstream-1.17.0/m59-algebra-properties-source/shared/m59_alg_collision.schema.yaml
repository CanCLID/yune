schema:
  schema_id: m59_alg_collision
  name: M59 algebra collision oracle
  version: "1.0"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  algebra:
    - fuzz/^hao$/hx/
    - abbrev/^hao$/hx/
    - derive/^hao$/hx/
    - derive/^hao$/hx/correction

translator:
  dictionary: m59_alg_collision
  enable_user_dict: false
