schema:
  schema_id: m59_alg_erase
  name: M59 algebra partial erase oracle
  version: "1.0"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  algebra:
    - erase/a/

translator:
  dictionary: m59_alg_erase
  enable_user_dict: false
