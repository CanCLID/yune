<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="524" viewBox="0 0 1040 524" role="img" aria-labelledby="title desc">
  <title id="title">Native Track A latency: M55 final Yune vs librime 1.17.0</title>
  <desc id="desc">M55 corrective gate run D (context read per keypress), 2026-07-04. Bar = Yune median / same-run upstream librime median; lower is better. Rows below 1x are faster than librime in this gate. The long rows measure type-sequence then one context observation.</desc>
