<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc">
  <title id="title">Native Track B memory: M55 product guard</title>
  <desc id="desc">M55 corrective gate run D. TypeDuck jyut6ping3_mobile is a product guard lane, not a same-run librime comparison. The process peak includes deploy/compile transients; median rows are the steady benchmark observations.</desc>
  <rect width="1040" height="260" fill="#FCFCFD"/>
  <text x="28" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2430">Native Track B memory: M55 product guard</text>
  <text x="28" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6F768A">M55 corrective gate run D. TypeDuck jyut6ping3_mobile is a product guard lane, not a same-run librime comparison.</text>
  <text x="28" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6F768A">The process peak includes deploy/compile transients; median rows are the steady benchmark observations.</text>
  <line x1="270.0" y1="95" x2="270.0" y2="234" stroke="#E6E8F0" stroke-width="1"/>
  <text x="270.0" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A" text-anchor="middle">0 MB</text>
  <line x1="386.5" y1="95" x2="386.5" y2="234" stroke="#E6E8F0" stroke-width="1"/>
  <text x="386.5" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A" text-anchor="middle">140 MB</text>
  <line x1="502.9" y1="95" x2="502.9" y2="234" stroke="#E6E8F0" stroke-width="1"/>
  <text x="502.9" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A" text-anchor="middle">280 MB</text>
  <line x1="619.4" y1="95" x2="619.4" y2="234" stroke="#E6E8F0" stroke-width="1"/>
  <text x="619.4" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A" text-anchor="middle">420 MB</text>
  <line x1="735.8" y1="95" x2="735.8" y2="234" stroke="#E6E8F0" stroke-width="1"/>
  <text x="735.8" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A" text-anchor="middle">560 MB</text>
  <text x="258" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#1F2430" text-anchor="end">process peak working set</text>
  <rect x="270" y="96" width="424.8" height="18" rx="2" fill="#F0986E" stroke="#804126" stroke-width="1"/>
  <text x="700.8" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F2430">510.7 MB</text>
  <text x="764.8" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A">below 564.1 MB guard</text>
  <text x="258" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#1F2430" text-anchor="end">key-sequence median working set</text>
  <rect x="270" y="130" width="66.5" height="18" rx="2" fill="#7FB1D6" stroke="#355E80" stroke-width="1"/>
  <text x="342.5" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F2430">80.0 MB</text>
  <text x="399.5" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6F768A">below 280.5 MB guard</text>
  <text x="258" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#1F2430" text-anchor="end">key-sequence private bytes</text>
  <rect x="270" y="164" width="29.7" height="18" rx="2" fill="#7FB1D6" stroke="#355E80" stroke-width="1"/>
  <text x="305.7" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F2430">35.7 MB</text>
