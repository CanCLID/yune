<text x="1023.6" y="223.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#c45a1b">1.713x</text>
<line x1="629.4" y1="192.0" x2="977.5" y2="205.0" stroke="#d9e2ec" stroke-width="2"/>
