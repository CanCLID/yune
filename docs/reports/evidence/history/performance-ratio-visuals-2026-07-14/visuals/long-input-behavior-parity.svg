<text x="1080.0" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#17202a">2.0x</text>
<text x="225.0" y="210.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#17202a">37-character</text>
<circle cx="629.4" cy="192.0" r="6" fill="#2463d4" stroke="#17202a" stroke-width="1"/>
<text x="639.4" y="197.0" text-anchor="start" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#2463d4">0.444x</text>
<polygon points="977.5,198.0 984.5,205.0 977.5,212.0 970.5,205.0" fill="#fbfcfe" stroke="#b7791f" stroke-width="2.5"/>
