<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;background:#fbfcfe">
<title id="title">Historical long-input behavior normalization crosses parity</title>
<desc id="desc">For both 37- and 59-character inputs, the all-prefix Yune/librime latency ratio is below parity, but candidate-text-matched and final-key ratios are above parity. Ratio is Yune latency divided by librime latency.</desc>
<rect width="1320" height="470" fill="#fbfcfe"/>
<text x="48.0" y="48.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#17202a">Historical long-input timing flips after behavior normalization</text>
<text x="48.0" y="78.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#52616f">afb7079b behavior-strata control · Yune latency / librime latency</text>
<text x="250.0" y="118.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2463d4">← Yune lower latency</text>
<text x="1080.0" y="118.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c45a1b">librime lower latency →</text>
<line x1="250.0" y1="138.0" x2="250.0" y2="360.0" stroke="#d9e2ec" stroke-width="1" stroke-dasharray="3 5"/>
<text x="250.0" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#17202a">0.125x</text>
<line x1="457.5" y1="138.0" x2="457.5" y2="360.0" stroke="#d9e2ec" stroke-width="1" stroke-dasharray="3 5"/>
<text x="457.5" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#17202a">0.250x</text>
<line x1="665.0" y1="138.0" x2="665.0" y2="360.0" stroke="#d9e2ec" stroke-width="1" stroke-dasharray="3 5"/>
<text x="665.0" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="400" fill="#17202a">0.500x</text>
<line x1="872.5" y1="138.0" x2="872.5" y2="360.0" stroke="#17202a" stroke-width="3"/>
<text x="872.5" y="387.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#17202a">1.0x</text>
<text x="872.5" y="132.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#17202a">1.000x PARITY</text>
