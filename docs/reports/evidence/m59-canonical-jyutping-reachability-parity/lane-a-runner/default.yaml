# Rime default settings — LANE A YUNE-RUNNER OVERLAY
# encoding: utf-8
#
# This is the stock rime-cantonese default.yaml with ONE change: schema_list is
# narrowed to jyut6ping3 only. Everything else (switcher, menu page_size 5,
# punctuator, key_binder, selector, recognizer, ascii_composer) is verbatim —
# full-fidelity, no stripping of the jyut6ping3 schema itself.
#
# WHY: the staged rime-cantonese default.yaml carries librime's stock six-schema
# list (luna_pinyin, bopomofo, cangjie5, quick5, stroke, terra_pinyin), of which
# bopomofo/quick5/terra_pinyin are absent from the rime-cantonese staging. Yune's
# workspace_update fails the WHOLE workspace on one missing schema
# (deployment.rs:638-641) where librime skips-and-logs, so the stock list makes the
# deploy fail. The rime-cantonese default.custom.yaml patch (schema_list: jyut6ping3)
# does select the right schema, but Yune reads custom patches from user_data_dir
# only (deployment.rs:1502) — it is in the shared dir, so it never applies. This
# overlay fixes both by listing only the schema that is actually staged.
#
# The missing-schema-tolerance divergence (Yune fail-whole vs librime skip-and-log)
# is a NAMED Lane A work item pending owner decision + librime evidence — it
# intersects the D-47 schema-general guarantee. This overlay unblocks the Lane A
# runner without prejudging that decision.

config_version: '0.50'

schema_list:
  - schema: jyut6ping3

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
