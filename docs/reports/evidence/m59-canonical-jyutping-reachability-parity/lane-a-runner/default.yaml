# Rime default settings — LANE A YUNE-RUNNER OVERLAY
# encoding: utf-8
#
# This is the stock rime-cantonese default.yaml with ONE change: schema_list is
# narrowed to jyut6ping3 only. Everything else (switcher, menu page_size 5,
# punctuator, key_binder, selector, recognizer, ascii_composer) is verbatim —
# full-fidelity, no stripping of the jyut6ping3 schema itself.
#
# WHY: the staged rime-cantonese default.yaml carries librime's stock six-schema
# list (luna_pinyin, bopomofo, cangjie5, quick5, stroke, terra_pinyin), of which
# bopomofo/quick5/terra_pinyin are absent from this staging. For a missing
# top-level schema, pinned librime continues deploying valid siblings but returns
# aggregate failure; Yune now matches that deployment result. The stock list
# therefore describes an intentionally failing workspace even though jyut6ping3
# itself is valid and deployable.
#
# The canonical Lane A runner needs a successful, reproducible workspace deploy,
# so this overlay lists only the schema actually staged for the run. It is runner
# setup, not per-schema engine behavior adaptation and not a missing-schema
# tolerance exception.

config_version: '0.50'

schema_list:
  - schema: jyut6ping3

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
